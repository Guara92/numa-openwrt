name: watch-upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A GitHub App installation token (unlike GITHUB_TOKEN) triggers
      # build.yml on the PR it opens. Short-lived (1 h), no long-lived PAT.
      - name: App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Update upstream.lock
        id: update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          lock_get() {
            awk -v sec="$1" -v key="$2" '
              /^[[:space:]]*\[/ { s=$0; gsub(/[][[:space:]]/, "", s); next }
              s==sec { line=$0; sub(/#.*/,"",line)
                n=split(line,kv,"="); if (n<2) next
                k=kv[1]; gsub(/[[:space:]]/,"",k); if (k!=key) next
                v=kv[2]; gsub(/^[[:space:]]+|[[:space:]]+$/,"",v); gsub(/"/,"",v); print v; exit }' upstream.lock
          }
          # Rewrite the value in place, keeping the alignment padding and any
          # trailing comment on that line. `s|^$1 .*|...|` replaced the whole
          # line, so every bot PR also deleted the comments documenting the key.
          set_lock() { # set_lock KEY VALUE QUOTED(1|0)
            if [ "$3" = 1 ]; then
              sed -i "s|^\([[:space:]]*$1[[:space:]]*=[[:space:]]*\)\"[^\"]*\"|\1\"$2\"|" upstream.lock
            else
              sed -i "s|^\([[:space:]]*$1[[:space:]]*=[[:space:]]*\)[^[:space:]#][^[:space:]#]*|\1$2|" upstream.lock
            fi
          }

          repo=$(lock_get upstream repo)

          tag=$(gh api "repos/$repo/releases/latest" --jq '.tag_name')
          obj=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
          type=${obj%% *}; sha=${obj##* }
          if [ "$type" = tag ]; then
            sha=$(gh api "repos/$repo/git/tags/$sha" --jq '.object.sha')
          fi

          old_tag=$(lock_get upstream tag)
          old_commit=$(lock_get upstream commit)
          old_rev=$(lock_get build rev)

          # `describe` is the drift detector prepare-src.sh checks against, so it
          # must follow the tag. Ask git rather than rebuilding the string by
          # hand: the same tool that produces it during a build produces it here.
          describe=$(sh .github/scripts/describe-upstream.sh "$repo" "$tag" "$sha" 2>/dev/null || true)
          if [ -z "$describe" ]; then
            echo "WARN: git describe failed for $tag; deriving it from the sha" >&2
            describe="$tag-0-g$(printf '%s' "$sha" | cut -c1-7)"
          fi

          # The release tag is v<semver>-r<rev>, so a new upstream tag starts at
          # r1, but a moved commit on the SAME tag must bump: reusing the rev
          # would point at a release tag that already exists and build.yml
          # refuses to overwrite it.
          changed=0
          if [ "$tag" != "$old_tag" ] || [ "$sha" != "$old_commit" ]; then
            set_lock tag "$tag" 1
            set_lock commit "$sha" 1
            if [ "$tag" = "$old_tag" ]; then
              set_lock rev "$((old_rev + 1))" 0
            else
              set_lock rev 1 0
            fi
            changed=1
          fi

          # `describe` is written whenever it disagrees with the tag, not only on
          # a pin move. A pin bumped by hand used to leave it pointing at the
          # previous tag, and prepare-src.sh then warned on every build. Deriving
          # it here also heals a PR opened by an older version of this workflow.
          if [ "$(lock_get build describe)" != "$describe" ]; then
            set_lock describe "$describe" 1
            changed=1
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "tag=$tag commit=$sha describe=$describe rev=$(lock_get build rev)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open PR
        if: steps.update.outputs.changed == '1'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/lock-${{ github.run_id }}
          commit-message: "chore(lock): track upstream"
          title: "chore(lock): track upstream"
          body: |
            Automated `upstream.lock` update. Review the pin diff before merging;
            merging triggers `build.yml`.

            The diff should be value-only: `tag`, `commit`, `describe` and
            `build.rev`. If comments or alignment moved, the `set_lock` helper in
            `watch-upstream.yml` is broken.
