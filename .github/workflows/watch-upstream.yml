name: watch-upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A GitHub App installation token (unlike GITHUB_TOKEN) triggers
      # build.yml on the PR it opens. Short-lived (1 h), no long-lived PAT.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Update upstream.lock
        id: update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          lock_get() {
            awk -v sec="$1" -v key="$2" '
              /^[[:space:]]*\[/ { s=$0; gsub(/[][[:space:]]/, "", s); next }
              s==sec { line=$0; sub(/#.*/,"",line)
                n=split(line,kv,"="); if (n<2) next
                k=kv[1]; gsub(/[[:space:]]/,"",k); if (k!=key) next
                v=kv[2]; gsub(/^[[:space:]]+|[[:space:]]+$/,"",v); gsub(/"/,"",v); print v; exit }' upstream.lock
          }
          set_lock() { sed -i "s|^$1 .*|$1 = \"$2\"|" upstream.lock; }

          repo=$(lock_get upstream repo)

          tag=$(gh api "repos/$repo/releases/latest" --jq '.tag_name')
          obj=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
          type=${obj%% *}; sha=${obj##* }
          if [ "$type" = tag ]; then
            sha=$(gh api "repos/$repo/git/tags/$sha" --jq '.object.sha')
          fi

          old_tag=$(lock_get upstream tag)
          old_commit=$(lock_get upstream commit)
          old_rev=$(lock_get build rev)

          # The release tag is v<semver>-r<rev>, so a new upstream tag starts at
          # r1, but a moved commit on the SAME tag must bump: reusing the rev
          # would point at a release tag that already exists and build.yml
          # refuses to overwrite it.
          if [ "$tag" != "$old_tag" ] || [ "$sha" != "$old_commit" ]; then
            set_lock tag "$tag"; set_lock commit "$sha"
            if [ "$tag" = "$old_tag" ]; then
              set_lock rev "$((old_rev + 1))"
            else
              set_lock rev 1
            fi
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.update.outputs.changed == '1'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/lock-${{ github.run_id }}
          commit-message: "chore(lock): track upstream"
          title: "chore(lock): track upstream"
          body: |
            Automated `upstream.lock` update. Review the pin diff before merging;
            merging triggers `build.yml`.
