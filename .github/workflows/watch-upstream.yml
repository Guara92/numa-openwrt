name: watch-upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A GitHub App installation token (unlike GITHUB_TOKEN) triggers
      # build.yml on the PR it opens. Short-lived (1 h), no long-lived PAT.
      - name: App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Update upstream.lock
        id: update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          lock_get() {
            awk -v sec="$1" -v key="$2" '
              /^[[:space:]]*\[/ { s=$0; gsub(/[][[:space:]]/, "", s); next }
              s==sec { line=$0; sub(/#.*/,"",line)
                n=split(line,kv,"="); if (n<2) next
                k=kv[1]; gsub(/[[:space:]]/,"",k); if (k!=key) next
                v=kv[2]; gsub(/^[[:space:]]+|[[:space:]]+$/,"",v); gsub(/"/,"",v); print v; exit }' upstream.lock
          }
          set_lock() { sed -i "s|^$1 .*|$1 = \"$2\"|" upstream.lock; }

          repo=$(lock_get upstream repo)
          pr=$(lock_get mimalloc pr)

          tag=$(gh api "repos/$repo/releases/latest" --jq '.tag_name')
          obj=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
          type=${obj%% *}; sha=${obj##* }
          if [ "$type" = tag ]; then
            sha=$(gh api "repos/$repo/git/tags/$sha" --jq '.object.sha')
          fi

          pj=$(gh api "repos/$repo/pulls/$pr")
          pmerged=$(printf '%s' "$pj" | jq -r '.merged')
          phead=$(printf '%s' "$pj" | jq -r '.head.sha')
          pmerge=$(printf '%s' "$pj" | jq -r '.merge_commit_sha // empty')

          old_tag=$(lock_get upstream tag)
          old_commit=$(lock_get upstream commit)
          old_head=$(lock_get mimalloc head)
          old_source=$(lock_get mimalloc source)

          changed=0
          if [ "$tag" != "$old_tag" ] || [ "$sha" != "$old_commit" ]; then
            set_lock tag "$tag"; set_lock commit "$sha"; set_lock rev 1
            changed=1
          fi
          [ "$phead" != "$old_head" ] && { set_lock head "$phead"; changed=1; }

          # If the PR merged and its merge commit is an ancestor of the tag,
          # drop the overlay.
          if [ "$pmerged" = true ] && [ -n "$pmerge" ]; then
            status=$(gh api "repos/$repo/compare/${pmerge}...${sha}" --jq '.status')
            case "$status" in ahead|identical)
              if [ "$old_source" != upstream ]; then
                set_lock source upstream
                changed=1
              fi ;;
            esac
          fi

          if [ "$changed" = 1 ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Open PR
        if: steps.update.outputs.changed == '1'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/lock-${{ github.run_id }}
          commit-message: "chore(lock): track upstream"
          title: "chore(lock): track upstream"
          body: |
            Automated `upstream.lock` update. Review the pin diff before merging;
            merging triggers `build.yml`.
