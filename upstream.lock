# Pinned inputs for a reproducible build. Any mismatch fails the build.

rust = "1.99.0"

[upstream]
repo   = "razvandimescu/numa"
tag    = "v0.25.0"
commit = "91389fe65dfd6e36937b4d96fa95de5ef0239120"

# Upstream links mimalloc on musl targets itself, so this repo applies no patch.
[mimalloc]
source = "upstream"

[build]
publish = "generic"                        # variant packaged in the ipk; "cortex-a73" is also built
rev     = 2                                # ipk version <upstream>-<rev>; release tag v<upstream>-r<rev>
describe = "v0.25.0-0-g91389fe"            # expected `git describe` of the tag; mismatch warns
