# Pinned inputs for a reproducible build. Any mismatch fails the build.

rust = "1.100.0"

[upstream]
repo   = "razvandimescu/numa"
tag    = "v0.25.2"
commit = "e966c0658eb65211429a29b01d194e7c68d517c1"

# Upstream links mimalloc on musl targets itself, so this repo applies no patch.
[mimalloc]
source = "upstream"

[build]
publish = "generic"                        # variant packaged in the ipk; "cortex-a73" is also built
rev     = 1                                # ipk version <upstream>-<rev>; release tag v<upstream>-r<rev>
describe = "v0.25.2-0-ge966c06"            # expected `git describe` of the tag; mismatch warns
